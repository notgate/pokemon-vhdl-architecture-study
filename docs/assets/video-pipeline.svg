<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">VHDL hardware flow</title>
  <desc id="desc">Pixel clock and reset feed VGA timing. Coordinates feed a coordinate map, parallel tile and sprite generators, a priority multiplexer, a two-bit palette, and VGA output. Sync also runs from VGA timing to the output.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#000"/>
    </marker>
    <style>
      .node,.divider{fill:#fff;stroke:#000;stroke-width:1.3}
      .edge{fill:none;stroke:#000;stroke-width:1.5;marker-end:url(#arrow)}
      .label{font:18px 'Times New Roman',Times,serif;fill:#000;text-anchor:middle;dominant-baseline:middle}
      .small{font-size:16px}
    </style>
  </defs>
  <rect width="1600" height="360" fill="#fff"/>

  <path class="edge" d="M130 67C155 67 150 147.5 180 147.5"/>
  <path class="edge" d="M130 293C155 293 150 212.5 180 212.5"/>
  <path class="edge" d="M430 147.5C447 147.5 447 180 465 180"/>
  <path class="edge" d="M685 180C705 180 700 77 720 77"/>
  <path class="edge" d="M685 180C705 180 700 283 720 283"/>
  <path class="edge" d="M940 77C960 77 955 147.5 975 147.5"/>
  <path class="edge" d="M940 283C960 283 955 212.5 975 212.5"/>
  <path class="edge" d="M1225 180H1260"/>
  <path class="edge" d="M1460 180H1475"/>
  <path class="edge" d="M430 212.5C450 212.5 445 338 800 338H1435C1460 338 1465 232 1495 207"/>

  <rect class="node" x="20" y="40" width="110" height="54"/>
  <text class="label small" x="75" y="67">pixel clock</text>
  <rect class="node" x="20" y="266" width="110" height="54"/>
  <text class="label small" x="75" y="293">reset</text>

  <rect class="node" x="180" y="115" width="250" height="130"/>
  <line class="divider" x1="245" y1="115" x2="245" y2="245"/>
  <line class="divider" x1="365" y1="115" x2="365" y2="245"/>
  <line class="divider" x1="180" y1="180" x2="245" y2="180"/>
  <line class="divider" x1="365" y1="180" x2="430" y2="180"/>
  <text class="label small" x="212.5" y="147.5">clock</text>
  <text class="label small" x="212.5" y="212.5">reset</text>
  <text class="label" x="305" y="180">VGA timing</text>
  <text class="label small" x="397.5" y="147.5">x, y</text>
  <text class="label small" x="397.5" y="212.5">sync</text>

  <rect class="node" x="465" y="138" width="220" height="84"/>
  <line class="divider" x1="520" y1="138" x2="520" y2="222"/>
  <line class="divider" x1="630" y1="138" x2="630" y2="222"/>
  <text class="label small" x="492.5" y="180">x, y</text>
  <text class="label small" x="575" y="180">coordinate map</text>
  <text class="label small" x="657.5" y="180">logical</text>

  <rect class="node" x="720" y="35" width="220" height="84"/>
  <line class="divider" x1="775" y1="35" x2="775" y2="119"/>
  <line class="divider" x1="900" y1="35" x2="900" y2="119"/>
  <text class="label small" x="747.5" y="77">logical</text>
  <text class="label small" x="837.5" y="77">Tile generator</text>
  <text class="label small" x="920" y="77">shade</text>

  <rect class="node" x="720" y="241" width="220" height="84"/>
  <line class="divider" x1="775" y1="241" x2="775" y2="325"/>
  <line class="divider" x1="900" y1="241" x2="900" y2="325"/>
  <text class="label small" x="747.5" y="283">logical</text>
  <text class="label small" x="837.5" y="283">Sprite generator</text>
  <text class="label small" x="920" y="283">shade</text>

  <rect class="node" x="975" y="115" width="250" height="130"/>
  <line class="divider" x1="1040" y1="115" x2="1040" y2="245"/>
  <line class="divider" x1="1160" y1="115" x2="1160" y2="245"/>
  <line class="divider" x1="975" y1="180" x2="1040" y2="180"/>
  <text class="label small" x="1007.5" y="147.5">tile</text>
  <text class="label small" x="1007.5" y="212.5">sprite</text>
  <text class="label" x="1100" y="180">Priority mux</text>
  <text class="label small" x="1192.5" y="180">shade</text>

  <rect class="node" x="1260" y="138" width="200" height="84"/>
  <line class="divider" x1="1315" y1="138" x2="1315" y2="222"/>
  <line class="divider" x1="1400" y1="138" x2="1400" y2="222"/>
  <text class="label small" x="1287.5" y="180">shade</text>
  <text class="label small" x="1357.5" y="180">2-bit palette</text>
  <text class="label small" x="1430" y="180">RGB</text>

  <ellipse class="node" cx="1530" cy="180" rx="55" ry="34"/>
  <text class="label small" x="1530" y="180">VGA output</text>
</svg>
